# PDF Text Extraction API
# 部署於 OCI ARM 機器，加入既有 stack 的 'internal' network，
# 由 stack 的 Caddy reverse proxy 對外（pdf-api.{$DOMAIN}）。
services:
  pdf-text-api:
    build: .
    image: pdf-text-api:latest
    container_name: pdf-text-api
    restart: unless-stopped
    environment:
      - MAX_FILE_MB=20
    networks:
      - internal
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

networks:
  internal:
    name: internal
    external: true
