<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF 附件提取工具 — 安全、快速、免上傳</title>
    <meta name="description" content="在瀏覽器中安全地解密與提取 PDF 內嵌附件，檔案不會上傳至任何伺服器。">
    <meta name="theme-color" content="#0b0b14">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📎</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Decorative background orbs -->
    <div class="bg-orb bg-orb--1" aria-hidden="true"></div>
    <div class="bg-orb bg-orb--2" aria-hidden="true"></div>

    <div class="app">
        <header class="app-header">
            <div class="logo-icon" aria-hidden="true">
                <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
                    <rect x="4" y="2" width="24" height="32" rx="3" stroke="currentColor" stroke-width="2"/>
                    <path d="M28 10V2L36 10H28Z" fill="currentColor" opacity="0.3" stroke="currentColor" stroke-width="2"/>
                    <rect x="28" y="10" width="8" height="0" rx="0"/>
                    <line x1="10" y1="16" x2="22" y2="16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    <line x1="10" y1="21" x2="22" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    <line x1="10" y1="26" x2="18" y2="26" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    <circle cx="30" cy="28" r="9" fill="#0b0b14" stroke="currentColor" stroke-width="2"/>
                    <path d="M27 28L29.5 30.5L33.5 25.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <h1>PDF 附件提取工具</h1>
            <p class="tagline">安全解密 · 提取內嵌附件 · 瀏覽器離線處理</p>
        </header>

        <main class="card glass" id="main-card">
            <!-- Step 1: Upload -->
            <section id="step-upload" class="step active">
                <div class="drop-zone" id="drop-zone" role="button" tabindex="0" aria-label="拖放或點擊選擇 PDF 檔案">
                    <div class="drop-zone__icon" aria-hidden="true">
                        <svg width="56" height="56" viewBox="0 0 56 56" fill="none">
                            <path d="M28 6L28 38" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                            <path d="M18 16L28 6L38 16" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M8 34V44C8 46.2091 9.79086 48 12 48H44C46.2091 48 48 46.2091 48 44V34" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                        </svg>
                    </div>
                    <p class="drop-zone__text">將 PDF 檔案拖放至此處</p>
                    <p class="drop-zone__hint">或點擊選擇檔案 · 支援加密 PDF</p>
                    <input type="file" id="file-input" accept=".pdf" hidden>
                </div>
            </section>

            <!-- Step 2: Password -->
            <section id="step-password" class="step">
                <div class="file-badge" id="password-file-badge">
                    <span class="file-badge__icon" aria-hidden="true">📄</span>
                    <div class="file-badge__info">
                        <span class="file-badge__name" id="pw-file-name"></span>
                        <span class="file-badge__size" id="pw-file-size"></span>
                    </div>
                </div>

                <div class="password-section">
                    <div class="lock-icon" aria-hidden="true">
                        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                            <rect x="5" y="12" width="18" height="14" rx="3" stroke="currentColor" stroke-width="2"/>
                            <path d="M9 12V8C9 5.23858 11.2386 3 14 3C16.7614 3 19 5.23858 19 8V12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            <circle cx="14" cy="19" r="2" fill="currentColor"/>
                            <line x1="14" y1="21" x2="14" y2="23" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                    </div>
                    <p class="password-label">此 PDF 已加密，請輸入密碼</p>
                    <div class="input-wrapper">
                        <input type="password" id="password-input" class="input" placeholder="輸入 PDF 開啟密碼" autocomplete="off">
                        <button id="toggle-password" class="btn-icon" type="button" aria-label="切換密碼顯示">
                            <svg id="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                    <p class="password-error" id="password-error" aria-live="polite"></p>
                </div>

                <div class="btn-group">
                    <button id="btn-back" class="btn btn--ghost" type="button">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 3L5 8L10 13"/></svg>
                        返回
                    </button>
                    <button id="btn-decrypt" class="btn btn--primary" type="button">解密並提取</button>
                </div>
            </section>

            <!-- Step 3: Processing -->
            <section id="step-processing" class="step">
                <div class="processing">
                    <div class="progress-spinner" aria-hidden="true"></div>
                    <p class="processing-text" id="processing-text">正在讀取 PDF⋯</p>
                </div>
            </section>

            <!-- Step 4: Results -->
            <section id="step-results" class="step">
                <div class="results-header">
                    <h2>提取完成</h2>
                    <span class="badge" id="file-count"></span>
                </div>

                <div class="expiry-notice" id="expiry-notice">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M12 6V12L16 14"/>
                    </svg>
                    <span>資料將於 <strong id="expiry-countdown">15:00:00</strong> 後自動清除</span>
                    <button id="btn-clear-now" class="btn-clear" type="button">立即清除</button>
                </div>

                <ul id="file-list" class="file-list" role="list"></ul>
                <div class="btn-group">
                    <button id="btn-new" class="btn btn--ghost" type="button">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 2V14M2 8H14"/></svg>
                        處理另一個
                    </button>
                    <button id="btn-download-all" class="btn btn--accent" type="button">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 2V10M4 7L8 11L12 7"/><path d="M2 12V13C2 13.5523 2.44772 14 3 14H13C13.5523 14 14 13.5523 14 13V12"/></svg>
                        全部打包下載
                    </button>
                </div>
            </section>

            <!-- Step 5: No Attachments -->
            <section id="step-no-attachments" class="step">
                <div class="empty-state">
                    <div class="empty-state__icon" aria-hidden="true">
                        <svg width="56" height="56" viewBox="0 0 56 56" fill="none">
                            <circle cx="28" cy="28" r="22" stroke="currentColor" stroke-width="2" opacity="0.3"/>
                            <path d="M20 28H36" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                        </svg>
                    </div>
                    <p class="empty-state__text">此 PDF 沒有內嵌附件</p>
                    <p class="empty-state__hint">只有包含嵌入式檔案的 PDF 才能提取附件</p>
                    <button id="btn-empty-retry" class="btn btn--primary" type="button">選擇其他 PDF</button>
                </div>
            </section>

            <!-- Step 6: Error -->
            <section id="step-error" class="step">
                <div class="error-state">
                    <div class="error-state__icon" aria-hidden="true">
                        <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
                            <circle cx="24" cy="24" r="20" stroke="currentColor" stroke-width="2"/>
                            <path d="M17 17L31 31M31 17L17 31" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                        </svg>
                    </div>
                    <p class="error-state__message" id="error-message"></p>
                    <button id="btn-retry" class="btn btn--primary" type="button">重試</button>
                </div>
            </section>
        </main>

        <footer class="app-footer">
            <div class="privacy-notice">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                    <path d="M8 1L2 4V7.5C2 11.09 4.56 14.41 8 15.28C11.44 14.41 14 11.09 14 7.5V4L8 1Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                    <path d="M5.5 8L7.2 9.7L10.5 6.3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>所有處理在您的瀏覽器中完成 · 資料於 15 小時內自動清除 · 不留任何痕跡</span>
            </div>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="app.js?v=20260809-1"></script>
</body>
</html>
