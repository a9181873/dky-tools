services:
  # ============================================================
  # Caddy — reverse proxy, auto HTTPS
  # ============================================================
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro     # Cloudflare Origin Certificate
      - caddy_data:/data
      - caddy_config:/config
      - astro_dist:/srv/www:ro          # Astro 靜態檔案 (rsync 進來)
    networks:
      - proxy
      - internal        # Caddy 需 internal 才能反代 beszel / uptime-kuma / n8n / dify
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ============================================================
  # PostgreSQL 16 + pgvector
  # ============================================================
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      # 傳給 init.sh 建 role 用
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD}
      DIFY_DB_PASSWORD: ${DIFY_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # 調整 shared_buffers 到 1.5 GB (24 GB RAM 機器的 6%)
    command: >
      postgres
        -c shared_buffers=1536MB
        -c effective_cache_size=8GB
        -c work_mem=16MB
        -c maintenance_work_mem=256MB
        -c max_connections=100
        -c listen_addresses=*

  # ============================================================
  # Redis 7
  # ============================================================
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # Beszel — host + container metrics (輕量 Prometheus/Grafana 替代)
  # 管理介面走 Cloudflare Tunnel + Access，不對外開
  # ============================================================
  beszel:
    image: henrygd/beszel:latest
    restart: unless-stopped
    volumes:
      - beszel_data:/beszel_data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - internal
    # Port 只在 internal network 暴露給 Caddy，不 publish 到 host
    expose:
      - "8090"

  # Beszel agent (收集 host metrics)
  beszel-agent:
    image: henrygd/beszel-agent:latest
    restart: unless-stopped
    network_mode: host          # 需要 host network 才能讀 host metrics
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      PORT: "45876"
      KEY: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILT1Zm5ssJGVNg26V520GfJLGd7HsHlJYOhNwtxB3AmS"

  # ============================================================
  # Uptime Kuma — endpoint ping 監控
  # 管理介面走 Cloudflare Tunnel + Access
  # ============================================================
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    restart: unless-stopped
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      - internal
    expose:
      - "3001"


  # ============================================================
  # Stirling PDF — PDF web UI + Hermes API backend
  # ============================================================
  stirling-pdf:
    image: stirlingtools/stirling-pdf:latest-fat
    restart: unless-stopped
    environment:
      DOCKER_ENABLE_SECURITY: "true"
      DISABLE_ADDITIONAL_FEATURES: "false"
      SECURITY_ENABLELOGIN: "true"
      SECURITY_INITIALLOGIN_USERNAME: ${STIRLING_PDF_INITIAL_USERNAME}
      SECURITY_INITIALLOGIN_PASSWORD: ${STIRLING_PDF_INITIAL_PASSWORD}
      SECURITY_CUSTOMGLOBALAPIKEY: ${STIRLING_PDF_API_KEY}
      SYSTEM_DEFAULTLOCALE: "zh-TW"
      LANGS: "zh_TW,en_GB"
      SYSTEM_GOOGLEVISIBILITY: "false"
      SYSTEM_ENABLEANALYTICS: "false"
      SYSTEM_SHOWUPDATE: "false"
      DISABLE_PIXEL: "true"
      SYSTEM_CUSTOMHTMLFILES: "true"
      SYSTEM_MAXFILESIZE: "95"
      SERVER_FORWARDHEADERSSTRATEGY: "NATIVE"
      JAVA_TOOL_OPTIONS: "-Xms512m -Xmx4g"
      JAVA_CUSTOM_OPTS: "-Xms512m -Xmx4g"
    volumes:
      - ./stirling-pdf/configs:/configs
      - ./stirling-pdf/logs:/logs
      - ./stirling-pdf/pipeline:/pipeline
      - ./stirling-pdf/tessdata:/usr/share/tessdata
      - ./stirling-pdf/customFiles:/customFiles
    networks:
      - internal
    ports:
      - "127.0.0.1:18080:8080"
    expose:
      - "8080"
    mem_limit: 6g
    cpus: "2.0"

networks:
  proxy:
    name: proxy
  internal:
    name: internal
    # 不設 internal: true，因 n8n/dify/uptime-kuma 皆需 outbound 呼叫外部 API；
    # 對外隔離靠「不 publish port 到 host」+ OCI NSG 控制 inbound

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  beszel_data:
  uptime_kuma_data:
  astro_dist:                   # rsync Astro build 產出 dist/ 進此 volume
